<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Daftar - SosisBakar.net</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌭</text></svg>">
</head>
<body>
  <div class="form-page">
    <div class="form-card">
      <a class="logo" href="index.html"><span class="logo-icon">🌭</span> SosisBakar.net</a>
      <h1 class="form-title">Buat Akun 🎉</h1>
      <p class="form-sub">Daftar gratis untuk pemesanan yang lebih mudah.</p>
      <div class="form-error" id="errorBox"></div>
      <form id="registerForm">
        <div class="form-group">
          <label>Nama Lengkap</label>
          <input type="text" id="full_name" placeholder="Nama kamu" required>
        </div>
        <div class="form-group">
          <label>Email</label>
          <input type="email" id="email" placeholder="kamu@email.com" required>
        </div>
        <div class="form-group">
          <label>No. WhatsApp</label>
          <input type="tel" id="phone" placeholder="0812xxxxxxxx" required>
        </div>
        <div class="form-group">
          <label>Password</label>
          <input type="password" id="password" placeholder="Minimal 6 karakter" required>
        </div>
        <button type="submit" class="btn btn-primary btn-block" id="submitBtn">Daftar Sekarang</button>
      </form>
      <p class="form-link">Sudah punya akun? <a href="login.html">Masuk</a></p>
      <p class="form-link" style="margin-top:4px;"><a href="index.html">← Kembali ke Beranda</a></p>
    </div>
  </div>
  <script>window.BACKEND_URL='http://localhost:3000';</script>
  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
